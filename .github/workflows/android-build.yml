name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/frontEnd/package-lock.json

      - name: Install web dependencies
        working-directory: app/frontEnd
        run: npm ci

      - name: Test web app
        working-directory: app/frontEnd
        run: npm test

      # Gradle's npmBuild task runs `npm run build` (type-check, bundle, sync into assets) first
      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AirPulse-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
